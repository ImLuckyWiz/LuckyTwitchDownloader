name: Build LuckyTwitch

on:
  push:
    branches: [main, master, qt-migration]   # build on every push (qt-migration = the PySide6 work)
    tags: ["v*"]               # a tag like v1.2 also publishes a Release
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write              # needed to create the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-14          # Apple Silicon
            label: macos-arm64
          - os: macos-15-intel    # Intel
            label: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release notes match the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          notes=RELEASE_NOTES.md
          case "$GITHUB_REF_NAME" in *-*) notes=docs/migration/RELEASE_NOTES_QT.md ;; esac   # pre-release tag (v0.8.0-beta.1)
          first=$(head -n1 "$notes" | sed 's/^## *//; s/[[:space:]]*$//' | tr -d '\r')
          if [ "$first" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=$notes,line=1::First line is '## $first' but the tag is '$GITHUB_REF_NAME'. Update $notes before tagging."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-qt.txt pytest
      - name: "Run tests (Windows: Qt + engine + tkinter)"
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: "Run tests (macOS: Qt + engine)"
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests --ignore-glob="tests/test_gui_*.py" --ignore=tests/test_core_matches_tkinter.py -q
      - name: Ensure Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
      - name: Cache Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/Library/Caches/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt', 'luckytwitch_qt.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.bat ${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash build_mac.sh "${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyTwitch-${{ matrix.label }}
          path: |
            dist/LuckyTwitch-Setup.exe
            dist/LuckyTwitch-*.dmg

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check and test the Premiere plugin
        working-directory: premiere-plugin
        run: |
          npm run check
          npm test
      - name: Package the Premiere plugin
        run: |
          mkdir -p dist
          cd premiere-plugin
          # .ccx = a zip with manifest.json at its root; double-clicking it installs the plugin (Creative Cloud)
          zip -X -r ../dist/LuckyTwitch-Premiere-Plugin.ccx manifest.json index.html src
          # .zip = the same plus the dev install scripts, for a manual install when the .ccx will not open
          zip -X -r ../dist/LuckyTwitch-Premiere-Plugin.zip manifest.json index.html src README.md install-dev.bat install-dev.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyTwitch-plugin
          path: |
            dist/LuckyTwitch-Premiere-Plugin.ccx
            dist/LuckyTwitch-Premiere-Plugin.zip

  plugin-cep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check and test the Premiere CEP panel
        working-directory: premiere-plugin-cep
        run: |
          npm run check
          npm test
      - name: Package the Premiere CEP panel
        run: |
          mkdir -p dist
          cd premiere-plugin-cep
          # A CEP panel is a folder, not a single installable file like a .ccx: the zip holds the panel, its shared code and the install scripts
          # (they copy it into Premiere's CEP extensions folder and switch on "allow unsigned panels"). The tests above already checked that
          # src/markers-core.js is exactly the UXP plugin's file.
          chmod +x install-mac.command
          zip -X -r ../dist/LuckyTwitch-Premiere-Plugin-CEP.zip README.md install.bat install.ps1 install-mac.command cep-panel src -x "*.DS_Store"
      - name: Check the packaged CEP panel
        run: |
          rm -rf /tmp/cep-check && mkdir /tmp/cep-check
          unzip -q dist/LuckyTwitch-Premiere-Plugin-CEP.zip -d /tmp/cep-check
          cd /tmp/cep-check
          for f in README.md install.bat install.ps1 install-mac.command cep-panel/CSXS/manifest.xml cep-panel/index.html cep-panel/.debug \
                   cep-panel/js/runner.js cep-panel/js/ui.js cep-panel/jsx/host.jsx src/markers-core.js src/guard.js src/timecode.js src/progress.js; do
            test -s "$f" || { echo "::error::missing or empty in the CEP zip: $f"; exit 1; }
          done
          test -x install-mac.command || { echo "::error::install-mac.command lost its executable bit"; exit 1; }
          for f in src/*.js cep-panel/js/*.js; do node --check "$f"; done
          cmp src/markers-core.js "$GITHUB_WORKSPACE/premiere-plugin/src/markers-core.js"
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyTwitch-plugin-cep
          path: dist/LuckyTwitch-Premiere-Plugin-CEP.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, plugin, plugin-cep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release notes for this tag
        shell: bash
        run: |
          notes=RELEASE_NOTES.md
          case "$GITHUB_REF_NAME" in *-*) notes=docs/migration/RELEASE_NOTES_QT.md ;; esac
          awk -v tag="$GITHUB_REF_NAME" '
            { sub(/\r$/, "") }
            $0 == "## " tag { found=1; print; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' "$notes" > RELEASE_NOTES_FOR_TAG.md
      - uses: actions/download-artifact@v4
        with:
          pattern: LuckyTwitch-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.ccx
          body_path: RELEASE_NOTES_FOR_TAG.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
