name: Build LuckyTwitch

on:
  push:
    branches: [main, master]   # build on every push
    tags: ["v*"]               # a tag like v1.2 also publishes a Release
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write              # needed to create the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-14          # Apple Silicon
            label: macos-arm64
          - os: macos-15-intel    # Intel
            label: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release notes match the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          first=$(head -n1 RELEASE_NOTES.md | sed 's/^## *//; s/[[:space:]]*$//' | tr -d '\r')
          if [ "$first" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=RELEASE_NOTES.md,line=1::First line is '## $first' but the tag is '$GITHUB_REF_NAME'. Update RELEASE_NOTES.md before tagging."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.bat ${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyTwitch-${{ matrix.label }}
          path: |
            dist/LuckyTwitch-Setup.exe
            dist/LuckyTwitch-*.dmg

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check and test the Premiere plugin
        working-directory: premiere-plugin
        run: |
          npm run check
          npm test
      - name: Package the Premiere plugin
        run: |
          mkdir -p dist
          cd premiere-plugin
          # .ccx = a zip with manifest.json at its root; double-clicking it installs the plugin (Creative Cloud)
          zip -X -r ../dist/LuckyTwitch-Premiere-Plugin.ccx manifest.json index.html src
          # .zip = the same plus the dev install scripts, for a manual install when the .ccx will not open
          zip -X -r ../dist/LuckyTwitch-Premiere-Plugin.zip manifest.json index.html src README.md install-dev.bat install-dev.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyTwitch-plugin
          path: |
            dist/LuckyTwitch-Premiere-Plugin.ccx
            dist/LuckyTwitch-Premiere-Plugin.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LuckyTwitch-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.ccx
          body_path: RELEASE_NOTES.md
