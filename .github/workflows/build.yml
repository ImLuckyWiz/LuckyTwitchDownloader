name: Build LuckyTwitch

on:
  push:
    branches: [main, master]   # build on every push
    tags: ["v*"]               # a tag like v1.2 also publishes a Release
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write              # needed to create the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-14          # Apple Silicon
            label: macos-arm64
          - os: macos-15-intel    # Intel
            label: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release notes match the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          first=$(head -n1 RELEASE_NOTES.md | sed 's/^## *//; s/[[:space:]]*$//' | tr -d '\r')
          if [ "$first" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=RELEASE_NOTES.md,line=1::First line is '## $first' but the tag is '$GITHUB_REF_NAME'. Update RELEASE_NOTES.md before tagging."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.bat ${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyTwitch-${{ matrix.label }}
          path: |
            dist/LuckyTwitch-Setup.exe
            dist/LuckyTwitch-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LuckyTwitch-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
          body_path: RELEASE_NOTES.md
