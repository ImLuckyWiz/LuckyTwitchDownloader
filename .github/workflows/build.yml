name: Build LuckyTwitch

on:
  push:
    branches: [main, master]
    tags: ["v*"]               # a tag like v1.2 also publishes a Release
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write              # needed to create the Release

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        include:
          - python-version: "3.14"
            allow-failure: true
    # Python 3.14 is emerging/pre-release and some dependencies (e.g. PySide6) may lack 3.14 binary wheels; continue-on-error keeps CI green.
    continue-on-error: ${{ matrix.allow-failure || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: "Run tests"
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Check translation catalogs
        run: python tools/i18n.py check

  init-release:
    name: Initialize Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release notes for this tag
        shell: bash
        run: |
          notes=RELEASE_NOTES.md
          first=$(head -n1 "$notes" | sed 's/^## *//; s/[[:space:]]*$//' | tr -d '\r')
          if [ "$first" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=$notes,line=1::First line is '## $first' but the tag is '$GITHUB_REF_NAME'. Update $notes before tagging."
            exit 1
          fi
          awk -v tag="$GITHUB_REF_NAME" '
            { sub(/\r$/, "") }
            $0 == "## " tag { found=1; print; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' "$notes" > RELEASE_NOTES_FOR_TAG.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_FOR_TAG.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-14          # Apple Silicon
            label: macos-arm64
          - os: ubuntu-22.04      # Linux x86_64
            label: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release notes match the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          notes=RELEASE_NOTES.md
          first=$(head -n1 "$notes" | sed 's/^## *//; s/[[:space:]]*$//' | tr -d '\r')
          if [ "$first" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=$notes,line=1::First line is '## $first' but the tag is '$GITHUB_REF_NAME'. Update $notes before tagging."
            exit 1
          fi
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            patchelf file zsync
          # Download standalone appimagetool
          curl -sLO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          rm -rf appimagetool-x86_64.AppImage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: "Run tests"
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
      - name: Ensure Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
      - name: Cache Nuitka compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/Library/Caches/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt', 'luckytwitch_qt.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.bat ${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash build_mac.sh "${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}"
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash build_linux.sh "${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}"
      - name: Smoke test packaged catalogs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\LuckyTwitch\LuckyTwitch.exe" -ArgumentList "--i18n-selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The Windows build cannot find its translations (--i18n-selftest exit code $($p.ExitCode))" }
      - name: Smoke test packaged catalogs (macOS)
        if: runner.os == 'macOS'
        run: dist/LuckyTwitch.app/Contents/MacOS/LuckyTwitch --i18n-selftest
      - name: Smoke test packaged catalogs (Linux)
        if: runner.os == 'Linux'
        run: dist/LuckyTwitch/LuckyTwitch --i18n-selftest
      - name: Smoke test standalone binary (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/LuckyTwitch/LuckyTwitch --help || true
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyTwitch-${{ matrix.label }}
          path: |
            dist/LuckyTwitch-Setup.exe
            dist/LuckyTwitch-*.dmg
            dist/LuckyTwitch-*.AppImage
            dist/LuckyTwitch-*.tar.gz
      - name: Upload binaries to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LuckyTwitch-Setup.exe
            dist/LuckyTwitch-*.dmg
            dist/LuckyTwitch-*.AppImage
            dist/LuckyTwitch-*.tar.gz
          fail_on_unmatched_files: false

  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check and test the Premiere CEP panel
        working-directory: premiere-plugin-cep
        run: |
          npm run check
          npm test
      - name: Package Premiere CEP extension (ZIP and ZXP)
        run: |
          python tools/package_cep.py --dist dist
      - name: Verify packaged files
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/LuckyTwitch-Premiere-Plugin-CEP.zip")) { throw "Missing ZIP" }
          if (-not (Test-Path "dist/LuckyTwitch-Premiere-Plugin-CEP.zxp")) { throw "Missing ZXP" }
          Write-Host "Packaged artifacts verified successfully."
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyTwitch-plugin
          path: |
            dist/LuckyTwitch-Premiere-Plugin-CEP.zip
            dist/LuckyTwitch-Premiere-Plugin-CEP.zxp
      - name: Upload Premiere plugin to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LuckyTwitch-Premiere-Plugin-CEP.zip
            dist/LuckyTwitch-Premiere-Plugin-CEP.zxp
          fail_on_unmatched_files: false

  checksums:
    name: Generate and Upload SHA256SUMS
    needs: [build, plugin]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LuckyTwitch-*
          merge-multiple: true
          path: release
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Upload SHA256SUMS to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/SHA256SUMS.txt
