<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* Dark by default (Premiere's usual theme); light only when the host says so. Every control gets explicit colors
       so nothing falls back to black-on-gray. */
    :root {
      --lt-fg: #e6e6e6; --lt-bg: #2b2b2b; --lt-field: #3d3d3d; --lt-field-hover: #4a4a4a;
      --lt-border: #6a6a6a; --lt-accent: #2680eb; --lt-muted: #a8a8a8;
    }
    @media (prefers-color-scheme: light) {
      :root { --lt-fg: #1d1d1d; --lt-bg: #f0f0f0; --lt-field: #ffffff; --lt-field-hover: #e4e4e4; --lt-border: #9a9a9a; --lt-muted: #5a5a5a; }
    }
    html, body { height: 100%; margin: 0; padding: 0; }
    body { font-family: sans-serif; font-size: 12px; color: var(--lt-fg); }
    /* UXP panels do not scroll by themselves: the content lives in this box, which does. */
    #app { height: 100vh; overflow-y: scroll; box-sizing: border-box; padding: 10px 14px 40px 10px; }
    h2 { font-size: 13px; margin: 14px 0 6px; color: var(--lt-fg); }
    label { color: var(--lt-fg); }
    .row { display: flex; align-items: center; margin: 4px 0; }
    .row label { flex: 1; }
    .row select, .row input[type="text"] { width: 110px; }
    .muted { color: var(--lt-muted); }
    .block { margin: 6px 0; }
    button, select, input[type="text"], textarea {
      color: var(--lt-fg); background-color: var(--lt-field); border: 1px solid var(--lt-border); border-radius: 4px;
    }
    button { margin: 4px 4px 4px 0; padding: 4px 10px; }
    button:hover { background-color: var(--lt-field-hover); }
    button:disabled { color: var(--lt-muted); opacity: .6; }
    #import:not(:disabled) { background-color: var(--lt-accent); border-color: var(--lt-accent); color: #ffffff; }
    textarea { width: 100%; height: 60px; }
    #fileInfo { margin: 6px 0; white-space: pre-wrap; }
    #log { width: 100%; height: 240px; margin-top: 4px; white-space: pre-wrap; }
    .err { color: #ff6b6b; }
  </style>
</head>
<body>
<div id="app">
  <div class="block">
    <button id="pick">Choose .markers.json…</button>
    <div id="fileInfo" class="muted">No file chosen.</div>
    <div class="muted">Picker not working? Paste the file's text here:</div>
    <textarea id="pasted"></textarea>
    <button id="usePasted">Use pasted text</button>
  </div>

  <h2>What to import</h2>
  <div class="row"><input type="checkbox" id="importGames"><label for="importGames">Game / category markers</label>
    <select id="gameColor"></select></div>
  <div class="row"><input type="checkbox" id="gamePrefix"><label for="gamePrefix">Name them «GAME: …»</label></div>
  <div class="row"><input type="checkbox" id="importClips"><label for="importClips">Clip markers</label></div>
  <div class="row"><label for="minViews">Only clips with at least … views</label><input type="text" id="minViews"></div>

  <h2>Clip colors</h2>
  <div class="row"><input type="checkbox" id="colorByViews"><label for="colorByViews">Color by views</label></div>
  <div class="row"><label for="lowColor">Fewer than the mid tier</label><select id="lowColor"></select></div>
  <div class="row"><label for="midViews">Mid tier from … views</label><input type="text" id="midViews"></div>
  <div class="row"><label for="midColor">Mid tier color</label><select id="midColor"></select></div>
  <div class="row"><label for="highViews">High tier from … views</label><input type="text" id="highViews"></div>
  <div class="row"><label for="highColor">High tier color</label><select id="highColor"></select></div>
  <div class="row"><label for="clipColor">One color for all clips (when the above is off)</label><select id="clipColor"></select></div>

  <h2>Where</h2>
  <div class="row"><label for="offsetMode">The part starts…</label>
    <select id="offsetMode">
      <option value="start">at the start of the sequence</option>
      <option value="playhead">at the playhead</option>
    </select></div>

  <div class="block">
    <button id="import" disabled>Import markers into the active sequence</button>
    <div class="muted">One undo step (Ctrl/Cmd+Z) removes them again.</div>
  </div>

  <h2>Diagnostics</h2>
  <div class="muted">Only needed while checking that this plugin and your Premiere agree.</div>
  <div class="block">
    <button id="probe">Probe the API</button>
    <button id="testMarkers">Add test markers</button>
  </div>

  <div class="block">
    <button id="copyLog">Copy log</button>
    <button id="clearLog">Clear log</button>
    <span id="copyState" class="muted"></span>
  </div>
  <textarea id="log" readonly></textarea>

</div>
  <script src="src/boot.js"></script>
  <script src="src/markers-core.js"></script>
  <script src="src/premiere-adapter.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
